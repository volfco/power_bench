name: Build and deploy benchmark report

on:
  push:
    branches: [master]
    paths:
      - power_meter.duckdb
      - scripts/export_report_data.py
      - site/index.html
      - .github/workflows/deploy-report.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository (with LFS database)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exporter dependency
        run: pip install duckdb

      - name: Self-check scale mapping
        run: python scripts/export_report_data.py --check

      - name: Export report data from DuckDB
        run: python scripts/export_report_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
